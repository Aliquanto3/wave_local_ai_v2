default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check .
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-format
        name: ruff format --check
        entry: uv run ruff format --check .
        language: system
        pass_filenames: false
        always_run: true
      - id: mypy
        name: mypy src/ scripts/
        entry: uv run mypy src/ scripts/
        language: system
        pass_filenames: false
        always_run: true
      - id: detect-secrets
        name: detect-secrets
        # The fiche registry (aidd_docs/results/fiches/<sha256>.json) is a
        # content-addressed store of hardware fiches: every file is named by
        # its own hash and carries the model's published sha256, so the
        # Hex High Entropy String plugin fires on each new one. Baselining
        # them one at a time would block every future run's fiche, and the
        # value is the public GGUF checksum docs/setup.md tells a reader to
        # verify -- already baselined at aidd_docs/roster/models.json. The
        # pattern uses `.` for the separator and a character class rather
        # than `\.` so it survives shlex-splitting and Windows path
        # separators alike.
        entry: uv run python -X utf8 -m detect_secrets.pre_commit_hook --baseline .secrets.baseline --exclude-files fiches.[0-9a-f]{64}[.]json$
        language: system
        pass_filenames: true
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
