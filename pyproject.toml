[project]
name = "wave-local-ai-v2"
version = "0.2.0"
description = "Reproducible benchmark of local SLMs (llama.cpp) against cloud LLM APIs: runtime metrics bound to a hardware fiche, quality scores kept separate."
readme = "README.md"
authors = [
    { name = "Aliquanto3", email = "anael.yahi@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "codecarbon>=3.3.0",
    "cryptography>=50.0.0",
    "fastapi>=0.141.1",
    "nvidia-ml-py>=13.610.43",
    "psutil>=7.2.2",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "uvicorn>=0.52.4",
]

[[tool.mypy.overrides]]
module = "pynvml"
ignore_missing_imports = true

# Installed only by the release-build job (the `release` group) and by the
# benchmark loader (the `loaders` group), so absent from the default
# environment mypy runs in.
[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

# --cov-fail-under is coverage.py's only floor; it combines statements and
# branches into one percentage (no separate branch-only gate exists), so the
# floor must sit near the measured combined total (95.66%) or branch misses
# can hide under slack in the statement count. Only ever raise this floor.
[tool.pytest.ini_options]
addopts = "--cov=src/wave_local_ai_v2 --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=95"

[tool.coverage.run]
source = ["src/wave_local_ai_v2"]

[project.scripts]
wave-local-ai-v2 = "wave_local_ai_v2:main"
wave-local-ai-v2-quality = "wave_local_ai_v2.quality_cli:main"
wave-local-ai-v2-validate = "wave_local_ai_v2.fiche_validator:main"
wave-local-ai-v2-judge-probe = "wave_local_ai_v2.judge_probe:main"
wave-local-ai-v2-serve = "wave_local_ai_v2.service:main"
wave-local-ai-v2-export = "wave_local_ai_v2.bundle_export:main"
wave-local-ai-v2-compare = "wave_local_ai_v2.comparison:main"
wave-local-ai-v2-candidate-gate = "wave_local_ai_v2.candidate_gate:main"
wave-local-ai-v2-composition-check = "wave_local_ai_v2.composition_check:main"
wave-local-ai-v2-campaign-completeness = "wave_local_ai_v2.campaigns:main"
wave-local-ai-v2-promote = "wave_local_ai_v2.machine_results:main"
wave-local-ai-v2-merge-bundle = "wave_local_ai_v2.bundle_merge:main"
wave-local-ai-v2-client-sessions = "wave_local_ai_v2.client_sessions:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "detect-secrets>=1.5.0",
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pip-audit>=2.10.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.3",
    "ruff>=0.16.4",
    "scipy>=1.18.1",
    "types-psutil>=7.2.2.20260518",
    "types-pyyaml>=6.0.12.20260815",
    "types-requests>=2.33.0.20260712",
]
# Installed only to load a public benchmark into the JSONL source table a
# publication suite is drawn from (`uv run --group loaders python
# scripts/minds14_suite.py`): not a runtime dependency, not in the default sync.
loaders = [
    "pyarrow==25.0.1",
]
# Installed by the release-build job alone (`uv sync --locked --group release`):
# not a runtime dependency, not in the default `uv sync`, not in the image.
release = [
    "pyarrow==25.0.1",
]
