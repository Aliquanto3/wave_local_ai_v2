[project]
name = "wave-local-ai-v2"
version = "0.1.0"
description = "Reproducible benchmark of local SLMs (llama.cpp) against cloud LLM APIs: runtime metrics bound to a hardware fiche, quality scores kept separate."
readme = "README.md"
authors = [
    { name = "Aliquanto3", email = "anael.yahi@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "codecarbon>=3.3.0",
    "nvidia-ml-py>=13.610.43",
    "psutil>=7.2.2",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
]

[[tool.mypy.overrides]]
module = "pynvml"
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--cov=src/wave_local_ai_v2 --cov-report=term-missing --cov-report=xml --cov-fail-under=80"

[tool.coverage.run]
source = ["src/wave_local_ai_v2"]

[project.scripts]
wave-local-ai-v2 = "wave_local_ai_v2:main"
wave-local-ai-v2-quality = "wave_local_ai_v2.quality_cli:main"
wave-local-ai-v2-validate = "wave_local_ai_v2.fiche_validator:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "detect-secrets>=1.5.0",
    "mypy>=2.3.1",
    "pip-audit>=2.10.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.3",
    "ruff>=0.16.4",
    "types-psutil>=7.2.2.20260518",
    "types-pyyaml>=6.0.12.20260815",
    "types-requests>=2.33.0.20260712",
]
