name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # On demand: release-build builds and verifies the archive, Parquet
  # copies included, with no tag, no Release and no image push, so the
  # release path is proven between releases instead of rotting unnoticed.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.12"

      - run: uv sync --locked

      - name: Fast gate (lint, format, types, secrets)
        run: uv run pre-commit run --all-files

      - name: Tests (coverage-gated)
        run: uv run pytest

      # The published bundle is derived from the per-machine locations, never
      # hand-edited: this fails when the committed bundle differs from what
      # the merge produces (tests/test_bundle_merge.py backs it).
      - name: Derived bundle
        run: uv run wave-local-ai-v2-merge-bundle --check

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.xml

      - name: Coverage summary
        if: always()
        run: uv run coverage report >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      - name: Dependency audit
        run: uv run python scripts/audit_dependencies.py

  frontend:
    name: frontend
    # Ubuntu only, unlike `test`'s two-OS matrix: front-end tooling has no
    # OS-specific behavior this project depends on.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: frontend/.nvmrc

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format

      - name: Type check
        run: npm run typecheck

      - name: Tests (coverage-gated)
        run: npm test -- --coverage

  build:
    name: build
    # Also runs on a v* tag, not only on pull requests: `publish` needs this
    # job, and a needed job that never ran cannot gate anything. The tag's
    # image is therefore smoke-tested here before `publish` pushes it.
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE: wave-local-ai-v2:ci
      EXPECTED_SOURCE: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE }}
          build-args: |
            SOURCE=${{ env.EXPECTED_SOURCE }}
            REVISION=${{ github.sha }}

      - name: "Smoke test: the pinned llama-server runs on CPU"
        run: docker run --rm --entrypoint llama-server "$IMAGE" --version
        shell: bash

      - name: "Smoke test: an unconfigured run is refused"
        run: |
          set +e
          output=$(docker run --rm -e SLM_MODELS_DIR= "$IMAGE" 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -ne 1 ]; then
            echo "expected exit 1, got $status"
            exit 1
          fi
          if [ "$output" != "error: SLM_MODELS_DIR is not set" ]; then
            echo "unexpected message"
            exit 1
          fi
        shell: bash

      - name: "Smoke test: the OCI labels name the source and the commit"
        run: |
          source_label=$(docker inspect --format \
            '{{index .Config.Labels "org.opencontainers.image.source"}}' "$IMAGE")
          revision_label=$(docker inspect --format \
            '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE")
          if [ "$source_label" != "$EXPECTED_SOURCE" ]; then
            echo "source label is '$source_label', expected '$EXPECTED_SOURCE'"
            exit 1
          fi
          if [ "$revision_label" != "$GITHUB_SHA" ]; then
            echo "revision label is '$revision_label', expected '$GITHUB_SHA'"
            exit 1
          fi
          reported_sha=$(docker run --rm --entrypoint python "$IMAGE" -c \
            "from wave_local_ai_v2.build_info import commit_sha; print(commit_sha())")
          if [ "$reported_sha" != "$revision_label" ]; then
            echo "commit_sha() is '$reported_sha', expected revision label '$revision_label'"
            exit 1
          fi
          if [ "$reported_sha" != "$GITHUB_SHA" ]; then
            echo "commit_sha() is '$reported_sha', expected GITHUB_SHA '$GITHUB_SHA'"
            exit 1
          fi
        shell: bash

  verify-tag:
    name: verify-tag
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.12"

      - run: uv sync --locked

      - name: Tag name matches the packaged version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          packaged_version=$(uv run python -c "from wave_local_ai_v2.build_info import version; print(version())")
          if [ "$tag_version" != "$packaged_version" ]; then
            echo "tag '$GITHUB_REF_NAME' names version '$tag_version', but the package is '$packaged_version'"
            exit 1
          fi
        shell: bash

  publish:
    name: publish
    needs: [test, build, verify-tag]
    # A tag push only: an on-demand run on a tag ref pushes no image.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/aliquanto3/wave_local_ai_v2:${{ github.ref_name }}
            ghcr.io/aliquanto3/wave_local_ai_v2:latest
          build-args: |
            SOURCE=${{ github.server_url }}/${{ github.repository }}
            REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  release-build:
    name: release-build
    # The archive a third party reads with no clone, built and verified with
    # a read-only token: every dependency this job runs (pyarrow included)
    # never sits beside a write token. On a `v*` tag push it runs after test,
    # build and verify-tag; on demand (workflow_dispatch) after test alone
    # (build and verify-tag are tag-gated). Either way it uploads the archive
    # as a run artifact; only `release-publish` turns it into a Release.
    needs: [test, build, verify-tag]
    if: >-
      needs.test.result == 'success' && !cancelled() && (
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
      && needs.build.result == 'success' && needs.verify-tag.result == 'success')
      || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      archive-sha256: ${{ steps.archive.outputs.sha256 }}
    steps:
      # No token in .git/config while `uv sync` and `uv run` execute
      # dependency code, and no uv cache: this job's inputs are not restored
      # from a shared cache.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"

      # The `release` dependency group holds the pinned pyarrow that writes
      # the Parquet copies; no other job, and not the image, installs it.
      - run: uv sync --locked --group release

      # A tag push releases its tag; an on-demand run rehearses the release
      # the packaged version names, without any tag.
      - name: Name the release
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            release_tag="$GITHUB_REF_NAME"
          else
            release_tag="v$(uv run --group release python -c "from wave_local_ai_v2.build_info import version; print(version())")"
          fi
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
        shell: bash

      # The Parquet check itself, where pyarrow is installed: a copy with one
      # altered cell must fail it. The test matrix skips these tests.
      - name: Parquet check tests
        run: uv run --group release pytest tests/test_release_parquet.py --no-cov

      # Builds the tables from the bundle at the checked-out commit, writes a
      # typed Parquet copy of each, assembles the archive, then verifies it: a
      # hand-edited table, a Parquet copy that differs from its CSV in any
      # cell, a clone-only path, or a tag, version or commit disagreement
      # fails here, before any Release. The log lists every table compared.
      - name: Assemble and verify the release archive
        run: >-
          uv run --group release python scripts/assemble_release_archive.py build
          --tag "$RELEASE_TAG" --commit "$GITHUB_SHA" --output-dir dist --parquet
        shell: bash

      # The digest `release-publish` checks the downloaded archive against.
      - name: Record the archive digest
        id: archive
        run: |
          digest=$(sha256sum "dist/wave-local-ai-v2-${RELEASE_TAG#v}.zip" | cut -d' ' -f1)
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
          echo "archive sha256: $digest"
        shell: bash

      - name: Upload the release archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-archive
          path: dist/*.zip
          if-no-files-found: error

  release-publish:
    name: release-publish
    # The GitHub Release and its one asset. The only job holding
    # `contents: write`, which creating a Release needs, and it runs no
    # project or dependency code: no checkout, no uv. A tag push only, so an
    # on-demand run never reaches it.
    needs: [test, build, verify-tag, release-build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      # The archive `release-build` verified, checked against the digest it
      # computed before anything is published.
      - name: Download the verified archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCHIVE_SHA256: ${{ needs.release-build.outputs.archive-sha256 }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name release-archive --dir dist
          echo "$ARCHIVE_SHA256  dist/wave-local-ai-v2-${GITHUB_REF_NAME#v}.zip" | sha256sum -c -
        shell: bash

      - name: Create the Release and attach the archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "dist/wave-local-ai-v2-${GITHUB_REF_NAME#v}.zip"
          --repo "$GITHUB_REPOSITORY"
          --verify-tag --title "$GITHUB_REF_NAME"
          --notes "One archive: the result tables with typed Parquet copies, their column dictionary, the reference bundle they were derived from, LICENSE, LICENSE-DATA and CITATION.cff. See its README.md."
        shell: bash

  required:
    name: required
    needs: [test, build, frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check matrix result
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "test matrix did not succeed: ${{ needs.test.result }}"
            exit 1
          fi
          if [ "${{ needs.build.result }}" != "success" ] && [ "${{ needs.build.result }}" != "skipped" ]; then
            echo "build did not succeed: ${{ needs.build.result }}"
            exit 1
          fi
          if [ "${{ needs.frontend.result }}" != "success" ]; then
            echo "frontend did not succeed: ${{ needs.frontend.result }}"
            exit 1
          fi
        shell: bash
